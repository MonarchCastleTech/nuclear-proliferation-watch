name: NPW data refresh and Pages
on:
  push: {branches: [main]}
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: nuclear-proliferation-watch-pages, cancel-in-progress: false}
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - name: Cache source snapshots
        uses: actions/cache@v5
        with:
          path: ~/.cache/nuclear-proliferation-watch
          key: npw-source-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            npw-source-cache-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Refresh public data
        if: github.event_name != 'push'
        run: python pipeline/nuclear_proliferation_watch_pipeline.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mct-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "data: refresh ${GITHUB_RUN_ID} [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
      - name: Validate product identity
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/product-logo.svg
          grep -q 'assets/product-logo.svg' index.html
          grep -q 'Nuclear-escalation pressure' index.html
          ! grep -Eq 'Satellite Imagery|ACA|Customs Data' index.html assets/app.js
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html .nojekyll public/
          cp -R assets data public/
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: public}
      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Retry Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
